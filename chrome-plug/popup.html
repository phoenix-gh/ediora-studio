<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: sans-serif;
      background-color: #15202b;
      color: white;
    }
    h3 { font-size: 16px; margin: 0 0 10px 0; color: #1d9bf0; }
    p { font-size: 12px; color: #8899a6; line-height: 1.4; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-top: 10px;
    }
    .dot { width: 8px; height: 8px; background: #00ba7c; border-radius: 50%; }
  </style>
</head>
<body>
  <h3>X-AI Helper</h3>
  <p>自动点击与内容分析插件已在后台运行。</p>
  <div class="status">
    <div class="dot"></div>
    <span>控制台已注入页面</span>
  </div>
</body>
</html>
