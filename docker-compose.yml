services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wemedia
      POSTGRES_USER: wemedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wemedia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wemedia -d wemedia"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    command:
      - sh
      - -ec
      - |
        python -c 'import os, sys; ok = len(os.environ.get("WMS_WORKER_TOKEN", "")) >= 32; sys.stderr.write("" if ok else "WMS_WORKER_TOKEN must contain at least 32 characters\n"); sys.exit(0 if ok else 1)'
        exec uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      WMS_DATABASE_URL: postgresql+asyncpg://wemedia:${POSTGRES_PASSWORD:-wemedia}@postgres:5432/wemedia
      WMS_REDIS_URL: redis://redis:6379/0
      WMS_WORKER_QUEUE: ${WMS_WORKER_QUEUE:-content-jobs}
      WMS_DISABLE_SCHEDULER: "0"
      FEEDGRAB_DATA_DIR: /app/sessions
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      WMS_SPEECH_PROVIDER: ${WMS_SPEECH_PROVIDER:-mimo}
      WMS_SPEECH_MODEL: ${WMS_SPEECH_MODEL:-mimo-v2.5-tts}
      WMS_SPEECH_BASE_URL: ${WMS_SPEECH_BASE_URL:-https://api.xiaomimimo.com/v1}
      WMS_SPEECH_API_KEY: ${WMS_SPEECH_API_KEY:-}
      WMS_SPEECH_DEFAULT_VOICE: ${WMS_SPEECH_DEFAULT_VOICE:-mimo_default}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      WMS_WORKER_TOKEN: ${WMS_WORKER_TOKEN:-}
      WMS_CORS_ORIGINS: ${WMS_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads-data:/app/uploads
      - sessions-data:/app/sessions
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./wemedia-studio
    command:
      - sh
      - -ec
      - |
        node -e 'const ok = (process.env.WMS_WORKER_TOKEN ?? "").length >= 32; if (!ok) { console.error("WMS_WORKER_TOKEN must contain at least 32 characters"); process.exit(1) }'
        exec ./node_modules/.bin/tsx scripts/content-worker.ts
    environment:
      WMS_REDIS_URL: redis://redis:6379/0
      WMS_WORKER_QUEUE: ${WMS_WORKER_QUEUE:-content-jobs}
      WMS_API_URL: http://api:8000/api
      WMS_LLM_API_KEY: ${WMS_LLM_API_KEY:-}
      WMS_LLM_MODEL: ${WMS_LLM_MODEL:-gpt-4o-mini}
      WMS_LLM_BASE_URL: ${WMS_LLM_BASE_URL:-}
      WMS_IMAGE_API_KEY: ${WMS_IMAGE_API_KEY:-}
      WMS_IMAGE_MODEL: ${WMS_IMAGE_MODEL:-gpt-image-1}
      WMS_IMAGE_BASE_URL: ${WMS_IMAGE_BASE_URL:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      WMS_WORKER_TOKEN: ${WMS_WORKER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./wemedia-studio
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      WMS_API_URL: http://api:8000/api
      WMS_LLM_API_KEY: ${WMS_LLM_API_KEY:-}
      WMS_LLM_MODEL: ${WMS_LLM_MODEL:-gpt-4o-mini}
      WMS_LLM_BASE_URL: ${WMS_LLM_BASE_URL:-}
      WMS_IMAGE_API_KEY: ${WMS_IMAGE_API_KEY:-}
      WMS_IMAGE_MODEL: ${WMS_IMAGE_MODEL:-gpt-image-1}
      WMS_IMAGE_BASE_URL: ${WMS_IMAGE_BASE_URL:-}
      WMS_WORKER_TOKEN: ${WMS_WORKER_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  sessions-data:
