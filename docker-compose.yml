x-app-image: &app-image
  image: ${APP_IMAGE:-ediora-studio}:${IMAGE_TAG:-local}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wemedia
      POSTGRES_USER: wemedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wemedia}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wemedia -d wemedia"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  local-asr:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda
    profiles:
      - local-asr
    restart: unless-stopped
    environment:
      WHISPER__INFERENCE_DEVICE: ${LOCAL_ASR_DEVICE:-cuda}
      WHISPER__COMPUTE_TYPE: ${LOCAL_ASR_COMPUTE_TYPE:-float16}
    volumes:
      - ./data/local-asr-models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *app-image
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    command:
      - sh
      - -ec
      - |
        python -c 'import os, sys; ok = len(os.environ.get("WORKER_TOKEN", "")) >= 32; sys.stderr.write("" if ok else "WORKER_TOKEN must contain at least 32 characters\n"); sys.exit(0 if ok else 1)'
        exec uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://wemedia:${POSTGRES_PASSWORD:-wemedia}@postgres:5432/wemedia
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE: ${WORKER_QUEUE:-content-jobs}
      VIDEO_WORKER_QUEUE: ${VIDEO_WORKER_QUEUE:-content-jobs:video}
      DISABLE_SCHEDULER: "0"
      FEEDGRAB_DATA_DIR: /app/sessions
      SCHEDULER_STATE_FILE: /app/.runtime/scheduler_state.json
      LOCAL_ASR_URL: ${LOCAL_ASR_URL:-http://local-asr:8000/v1}
      LOCAL_ASR_MODEL: ${LOCAL_ASR_MODEL:-Systran/faster-whisper-large-v3}
      LOCAL_ASR_DEVICE: ${LOCAL_ASR_DEVICE:-cuda}
      LOCAL_ASR_COMPUTE_TYPE: ${LOCAL_ASR_COMPUTE_TYPE:-float16}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      X_SESSION_KEY: ${X_SESSION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/sessions:/app/sessions
      - ./data/avatars:/app/avatars
      - ./data/wechat-images:/app/wechat_imgs
      - ./data/scheduler:/app/.runtime
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app-image
    restart: unless-stopped
    working_dir: /app/web
    command:
      - sh
      - -ec
      - |
        node -e 'const ok = (process.env.WORKER_TOKEN ?? "").length >= 32; if (!ok) { console.error("WORKER_TOKEN must contain at least 32 characters"); process.exit(1) }'
        exec ./node_modules/.bin/tsx scripts/content-worker.ts
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE: ${WORKER_QUEUE:-content-jobs}
      VIDEO_WORKER_QUEUE: ${VIDEO_WORKER_QUEUE:-content-jobs:video}
      API_URL: http://api:8000/api
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    <<: *app-image
    restart: unless-stopped
    working_dir: /app/web
    command:
      - ./node_modules/.bin/next
      - start
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      DEVELOPER_MODE: ${NEXT_PUBLIC_DEVELOPER_MODE:-0}
      API_URL: http://api:8000/api
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/web-runtime:/app/web/.runtime
    depends_on:
      api:
        condition: service_healthy
